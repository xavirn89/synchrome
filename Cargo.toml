[workspace]
resolver = "2"
members = [
    "crates/synchrome-types",
    "crates/synchrome-browser",
    "crates/synchrome-storage",
    "crates/synchrome-supabase",
    "crates/synchrome-sync",
    "crates/synchrome-bridge",
    "crates/synchrome-config",
    "crates/synchrome-http",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
synchrome-types = { path = "crates/synchrome-types" }
synchrome-browser = { path = "crates/synchrome-browser" }
synchrome-storage = { path = "crates/synchrome-storage" }
synchrome-supabase = { path = "crates/synchrome-supabase" }
synchrome-sync = { path = "crates/synchrome-sync" }
synchrome-bridge = { path = "crates/synchrome-bridge" }
synchrome-config = { path = "crates/synchrome-config" }
synchrome-http = { path = "crates/synchrome-http" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
dotenvy = "0.15"
