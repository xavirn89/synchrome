<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Synchrome</title>
  <link rel="stylesheet" href="brand-tokens.css" />
  <style>
    body { margin: 0; width: 280px; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--fg); }
    main { padding: 16px; }
    h1 { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 650; margin: 0 0 12px; }
    .state { display: inline-block; padding: 4px 8px; border-radius: 5px; font-size: 12px; }
    .connected { background: var(--accent-soft); color: var(--accent); }
    .unmapped { background: var(--surface); color: var(--muted); }
    .token_mismatch { background: var(--warning-soft); color: var(--warning); }
    .app_unavailable { background: var(--danger-soft); color: var(--danger); }
    .row { margin-top: 8px; color: var(--muted); overflow-wrap: anywhere; }
    .row strong { color: var(--fg); }
    button { margin-top: 12px; width: 100%; min-height: 40px; background: var(--surface); color: var(--fg);
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; }
    button:disabled { opacity: .45; cursor: default; }
    button.small { margin-top: 8px; font-size: 12px; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (hover: hover) { button:not(:disabled):hover { background: var(--accent-soft); } }
  </style>
</head>
<body>
  <main>
    <h1><img src="icons/32.png" width="24" height="24" alt="" />Synchrome</h1>
    <div><span id="state" class="state unmapped">…</span></div>
    <div class="row" id="profile"></div>
    <div class="row" id="detail"></div>
    <div class="row" id="bookmarks"></div>
    <div class="row" id="download"></div>
    <div class="row" id="extensions"></div>
    <div id="ext-actions"></div>
    <button id="reconnect">Reconnect</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
