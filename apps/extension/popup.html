<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Synchrome</title>
  <style>
    body { margin: 0; width: 280px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1720; color: #e6edf3; }
    main { padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #5ac8be; }
    .state { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; border: 1px solid transparent; }
    .connected { background: #10301f; color: #5fd08a; border-color: #1c7a44; }
    .unmapped { background: #1b2733; color: #8a97a4; border-color: #2b3a49; }
    .token_mismatch { background: #3a2a10; color: #e0a94a; border-color: #8a6320; }
    .app_unavailable { background: #3a1414; color: #f08a8a; border-color: #8a2a2a; }
    .row { margin-top: 8px; color: #9aa7b4; }
    .row strong { color: #e6edf3; }
    button { margin-top: 12px; width: 100%; background: #1b2733; color: #e6edf3; border: 1px solid #2b3a49;
      border-radius: 7px; padding: 7px; cursor: pointer; font: inherit; }
    button:disabled { opacity: .5; }
    button.small { margin-top: 6px; padding: 5px; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Synchrome</h1>
    <div><span id="state" class="state unmapped">…</span></div>
    <div class="row" id="profile"></div>
    <div class="row" id="detail"></div>
    <div class="row" id="bookmarks"></div>
    <div class="row" id="download"></div>
    <div class="row" id="extensions"></div>
    <div id="ext-actions"></div>
    <button id="reconnect">Reconnect</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
