[package]
name = "synchrome-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Synchrome desktop app (Tauri 2)."

[lib]
name = "synchrome_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
synchrome-types = { workspace = true }
synchrome-browser = { workspace = true }
synchrome-config = { workspace = true }
synchrome-supabase = { workspace = true }
synchrome-auth = { workspace = true }
